name: Android Build & Debug

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$RUNNER_TEMP/android-sdk}}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          mkdir -p "$TOOLS_DIR"
          curl -fsSL --retry 3 \
            -o "$RUNNER_TEMP/android-cmdline-tools.zip" \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          rm -rf "$RUNNER_TEMP/android-cmdline-tools" "$TOOLS_DIR/latest"
          unzip -q "$RUNNER_TEMP/android-cmdline-tools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$TOOLS_DIR/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare environment
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Restore and validate Firebase Android config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          : "${GOOGLE_SERVICES_JSON:?Missing repository secret GOOGLE_SERVICES_JSON}"
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          clients = config.get("client", [])
          packages = {
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          }
          app_ids = {
              client.get("client_info", {}).get("mobilesdk_app_id")
              for client in clients
          }
          if project_id != "parental-control-3bda8":
              raise SystemExit("Firebase config has an unexpected project_id")
          if "com.aistudio.parentalcontrol.pxmz" not in packages:
              raise SystemExit("Firebase config is missing the expected Android package")
          if "1:985693497148:android:832d60d29f9f11d5e2a039" not in app_ids:
              raise SystemExit("Firebase config is missing the expected Android app ID")
          print("Firebase config validated (project, app ID, and package); contents redacted.")
          PY

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: parental-control-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Remove temporary Firebase config
        if: always()
        run: rm -f app/google-services.json

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

      - name: Build logs on failure
        if: failure()
        run: |
          echo "=== BUILD FAILED ==="
          if [ -f app/build/outputs/errors/errors.txt ]; then
            cat app/build/outputs/errors/errors.txt
          fi
          echo "=== Check gradle logs ==="

  firebase-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install rules test dependencies
        working-directory: firebase
        run: npm ci

      - name: Run Firestore rules tests (emulator)
        working-directory: firebase
        run: npm test
